<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="theme-color" content="#071126">
  <title>Clock 11 · Daylight Flow</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="viewport" aria-label="Melbourne daylight clock">
    <section id="stage">
      <div class="sky" aria-hidden="true">
        <div id="baseGradient" class="base-gradient"></div>
        <div id="hourFlows" class="hour-flows"></div>
        <div class="sky-depth"></div>
      </div>

      <div class="solar-layer" aria-hidden="true">
        <div id="sunriseRule" class="solar-rule"><span id="sunriseLabel">SUNRISE 07:02</span></div>
        <div id="noonRule" class="solar-rule noon"><span id="noonLabel">SOLAR NOON 12:15</span></div>
        <div id="sunsetRule" class="solar-rule"><span id="sunsetLabel">SUNSET 17:43</span></div>
      </div>

      <section id="timeCard" class="time-card" aria-label="Current Melbourne time">
        <div class="card-left">
          <div class="card-kicker">MELBOURNE <span id="zone" class="zone">AEST</span></div>
          <div class="time">
            <span id="hh" class="num">13</span><span class="colon">:</span><span id="mm" class="num">51</span><span class="colon">:</span><span id="ss" class="num">00</span>
          </div>
        </div>
        <div class="card-right">
          <div id="day" class="day">SUNDAY</div>
          <div id="date" class="date">16 AUGUST 2026</div>
          <div id="state" class="state">DAYLIGHT CLOCK</div>
        </div>
        <div id="cardPointer" class="card-pointer" aria-hidden="true"></div>
      </section>

      <div id="nowLine" class="now-line" aria-hidden="true"><span></span></div>

      <div class="timeline" aria-hidden="true">
        <span style="left:0%">00:00</span>
        <span style="left:25%">06:00</span>
        <span style="left:50%">12:00</span>
        <span style="left:75%">18:00</span>
        <span style="left:100%">24:00</span>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
